<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{BRAND_NAME}} — Social Post</title>
{{FONT_LINK}}
<style>
  :root {
    --primary: {{PRIMARY_COLOR}};
    --secondary: {{SECONDARY_COLOR}};
    --neutral: {{NEUTRAL_TONE}};
    --ink: oklch(0.22 0.01 75);
    --ink-light: oklch(0.45 0.008 75);
    --ink-caption: oklch(0.55 0.006 75);
    --paper: oklch(0.97 0.008 85);
    --paper-warm: oklch(0.94 0.012 80);
    --paper-deep: oklch(0.90 0.015 78);
    --rule: oklch(0.82 0.01 80);
    --display-font: {{DISPLAY_FONT}};
    --body-font: {{BODY_FONT}};
    --post-width: 1080px;
    --post-height: 1080px;
    --gutter: 80px;
    --padding: 100px;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  .post ~ .post {
    display: none;
  }

  body {
    width: var(--post-width);
    height: var(--post-height);
    overflow: hidden;
    font-family: var(--body-font), "Helvetica Neue", Helvetica, sans-serif;
    color: var(--ink);
    background: var(--paper);
    line-height: 1.6;
    letter-spacing: 0.005em;
    -webkit-font-smoothing: antialiased;
  }

  .post {
    width: var(--post-width);
    height: var(--post-height);
    display: flex;
    flex-direction: column;
    position: relative;
    overflow: hidden;
  }

  /* ---- TYPOGRAPHY ---- */

  .t-display {
    font-family: var(--display-font), Georgia, serif;
    font-size: 88px;
    font-weight: 300;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--ink);
  }

  .t-h1 {
    font-family: var(--display-font), Georgia, serif;
    font-size: 56px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ink);
  }

  .t-body {
    font-family: var(--body-font), sans-serif;
    font-size: 28px;
    line-height: 1.6;
    color: var(--ink);
  }

  .t-label {
    font-family: var(--body-font), sans-serif;
    font-size: 18px;
    font-weight: 600;
    line-height: 1.3;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-caption);
  }

  /* ---- LOGO ROW ---- */

  .post__logo-row {
    display: flex;
    align-items: center;
    padding: 60px var(--padding) 0;
    flex-shrink: 0;
  }

  .post__logo {
    height: 52px;
    display: flex;
    align-items: center;
  }

  .post__logo svg {
    max-height: 52px;
    max-width: 200px;
  }

  .post__logo img {
    max-height: 52px;
    max-width: 200px;
    object-fit: contain;
  }

  .post__type-badge {
    font-family: var(--body-font), sans-serif;
    font-size: 16px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--primary);
    margin-left: auto;
  }

  /* ---- POST TYPE: QUOTE ---- */

  .post--quote {
    justify-content: center;
  }

  .post--quote .post__logo-row {
    margin-bottom: 60px;
  }

  .post__quote-block {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 var(--padding);
    padding-bottom: 80px;
  }

  .post__quote-mark {
    font-family: var(--display-font), Georgia, serif;
    font-size: 120px;
    font-weight: 300;
    line-height: 0.6;
    color: var(--primary);
    margin-bottom: 20px;
  }

  .post__quote-text {
    font-family: var(--display-font), Georgia, serif;
    font-size: 52px;
    font-weight: 400;
    line-height: 1.2;
    letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 760px;
    margin-bottom: 30px;
  }

  .post__quote-rule {
    width: 60px;
    height: 2px;
    background: var(--primary);
    margin-bottom: 30px;
  }

  /* ---- POST TYPE: ANNOUNCEMENT ---- */

  .post--announcement {
    background: var(--paper-warm);
  }

  .post--announcement .post__logo-row {
    margin-bottom: 40px;
  }

  .post__announce-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 var(--padding);
    padding-bottom: 80px;
  }

  .post__announce-overline {
    font-family: var(--body-font), sans-serif;
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--primary);
    margin-bottom: 20px;
  }

  .post__announce-headline {
    font-family: var(--display-font), Georgia, serif;
    font-size: 72px;
    font-weight: 300;
    line-height: 1.08;
    letter-spacing: -0.02em;
    color: var(--ink);
    max-width: 780px;
    margin-bottom: 28px;
  }

  .post__announce-text {
    font-family: var(--body-font), sans-serif;
    font-size: 28px;
    line-height: 1.6;
    color: var(--ink-light);
    max-width: 680px;
  }

  /* ---- POST TYPE: TIP ---- */

  .post--tip .post__logo-row {
    margin-bottom: 50px;
  }

  .post__tip-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 var(--padding);
    padding-bottom: 80px;
  }

  .post__tip-number {
    font-family: var(--display-font), Georgia, serif;
    font-size: 140px;
    font-weight: 300;
    line-height: 0.9;
    color: var(--primary);
    opacity: 0.25;
    margin-bottom: -20px;
  }

  .post__tip-headline {
    font-family: var(--display-font), Georgia, serif;
    font-size: 48px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 740px;
    margin-bottom: 24px;
  }

  .post__tip-text {
    font-family: var(--body-font), sans-serif;
    font-size: 26px;
    line-height: 1.6;
    color: var(--ink-light);
    max-width: 680px;
  }

  /* ---- POST TYPE: BEHIND THE SCENES ---- */

  .post--bts {
    background: var(--paper-warm);
    justify-content: flex-end;
  }

  .post--bts .post__logo-row {
    margin-bottom: 40px;
  }

  .post__bts-image-zone {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 0 var(--padding);
  }

  .post__bts-frame {
    width: 640px;
    height: 480px;
    background: var(--paper-deep);
    display: flex;
    align-items: center;
    justify-content: center;
  }

  .post__bts-frame-label {
    font-family: var(--body-font), sans-serif;
    font-size: 22px;
    font-weight: 600;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    color: var(--ink-caption);
  }

  .post__bts-caption {
    padding: 0 var(--padding);
    padding-bottom: 80px;
    flex-shrink: 0;
  }

  .post__bts-headline {
    font-family: var(--display-font), Georgia, serif;
    font-size: 42px;
    font-weight: 400;
    line-height: 1.15;
    letter-spacing: -0.01em;
    color: var(--ink);
    max-width: 700px;
    margin-bottom: 14px;
  }

  .post__bts-text {
    font-family: var(--body-font), sans-serif;
    font-size: 24px;
    line-height: 1.55;
    color: var(--ink-light);
    max-width: 620px;
  }
</style>
</head>
<body>

<div class="post post--{{POST_TYPE}}">

  <!-- QUOTE -->
  <div class="post__logo-row">
    <div class="post__logo">{{LOGO_SVG}}</div>
    <div class="post__type-badge">{{POST_TYPE}}</div>
  </div>

  <div class="post__quote-block">
    <div class="post__quote-mark">"</div>
    <div class="post__quote-text">{{HEADLINE}}</div>
    <div class="post__quote-rule"></div>
    <div class="t-label">{{BODY_TEXT}}</div>
  </div>

</div>

<div class="post post--announcement">

  <div class="post__logo-row">
    <div class="post__logo">{{LOGO_SVG}}</div>
    <div class="post__type-badge">{{POST_TYPE}}</div>
  </div>

  <div class="post__announce-body">
    <div class="post__announce-overline">New from {{BRAND_NAME}}</div>
    <div class="post__announce-headline">{{HEADLINE}}</div>
    <div class="post__announce-text">{{BODY_TEXT}}</div>
  </div>

</div>

<div class="post post--tip">

  <div class="post__logo-row">
    <div class="post__logo">{{LOGO_SVG}}</div>
    <div class="post__type-badge">{{POST_TYPE}}</div>
  </div>

  <div class="post__tip-body">
    <div class="post__tip-number">.</div>
    <div class="post__tip-headline">{{HEADLINE}}</div>
    <div class="post__tip-text">{{BODY_TEXT}}</div>
  </div>

</div>

<div class="post post--bts">

  <div class="post__logo-row">
    <div class="post__logo">{{LOGO_SVG}}</div>
    <div class="post__type-badge">{{POST_TYPE}}</div>
  </div>

  <div class="post__bts-image-zone">
    <div class="post__bts-frame">
      <span class="post__bts-frame-label">Photo</span>
    </div>
  </div>

  <div class="post__bts-caption">
    <div class="post__bts-headline">{{HEADLINE}}</div>
    <div class="post__bts-text">{{BODY_TEXT}}</div>
  </div>

</div>

</body>
</html>
